name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      - name: fuzz smoke
        run: go test -run '^$' -fuzz FuzzParse -fuzztime 60s ./internal/policy/
        env:
          GOCACHE: /tmp/go-build
